name: Artwork release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches catalog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          version = json.load(open('catalog.json', encoding='utf-8'))['version']
          expected = 'v' + version
          actual = os.environ['RELEASE_TAG']
          if expected != actual:
              sys.exit(f'Release tag {actual} does not match catalog.json version {version} '
                       f'(expected {expected}). Commit the matching catalog version before tagging.')
          PY
      - run: python -m unittest test_build_pack
      - run: python build_pack.py
      - name: Publish artwork assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/BB-Rentals.zip dist/BB-Rentals.json --title "BB-Rentals $RELEASE_TAG" --generate-notes
